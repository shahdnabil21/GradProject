<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Metro Ticket Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1e40af;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .logo {
      width: 34px; height: 34px;
      background: white; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #1e40af; font-size: 16px; font-weight: 800; flex-shrink: 0;
    }

    header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }

    main {
      flex: 1; padding: 20px 16px;
      display: flex; flex-direction: column; gap: 16px;
      max-width: 480px; width: 100%; margin: 0 auto;
    }

    /* ── Mode selector ── */
    .mode-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }

    .mode-btn {
      padding: 12px 10px; border: 2px solid #334155;
      border-radius: 10px; background: #1e293b;
      color: #94a3b8; font-size: 14px; font-weight: 600;
      cursor: pointer; text-align: center; transition: all 0.15s;
    }

    .mode-btn.active {
      border-color: #3b82f6; background: #1e3a8a; color: #fff;
    }

    /* ── Station select ── */
    .field-label {
      font-size: 13px; font-weight: 500; color: #94a3b8; margin-bottom: 6px;
    }

    select {
      width: 100%; padding: 13px 40px 13px 14px;
      background: #1e293b; border: 1.5px solid #334155;
      border-radius: 10px; color: #f1f5f9; font-size: 15px;
      appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
      background-repeat: no-repeat; background-position: right 12px center; background-size: 18px;
      cursor: pointer; transition: border-color 0.15s;
    }

    select:focus { outline: none; border-color: #3b82f6; }
    select option { background: #1e293b; }

    /* ── Sections ── */
    .section { display: none; flex-direction: column; gap: 14px; }
    .section.active { display: flex; }

    /* ── Scanner ── */
    .scan-hint { text-align: center; color: #94a3b8; font-size: 14px; }

    #reader { width: 100%; border-radius: 14px; overflow: hidden; background: #1e293b; }
    #reader video { border-radius: 14px; }

    /* ── Loading ── */
    #loading-section { align-items: center; padding: 48px 0; gap: 16px; }

    .spinner {
      width: 44px; height: 44px;
      border: 3px solid #1e293b; border-top-color: #3b82f6;
      border-radius: 50%; animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #64748b; font-size: 14px; }

    /* ── Result ── */
    #result-section { align-items: center; padding: 32px 0; gap: 18px; text-align: center; }

    .status-icon {
      width: 68px; height: 68px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 30px;
    }

    .status-icon.success { background: #14532d; }
    .status-icon.error   { background: #7f1d1d; }

    .status-title { font-size: 18px; font-weight: 700; }
    .status-title.success { color: #4ade80; }
    .status-title.error   { color: #f87171; }

    .status-detail { font-size: 14px; color: #94a3b8; max-width: 300px; line-height: 1.5; }

    /* ── Notice ── */
    .notice {
      background: #1e293b; border-radius: 10px; padding: 14px 16px;
      color: #94a3b8; font-size: 13px; text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">M</div>
    <h1>Metro Staff Scanner</h1>
  </header>

  <main>
    <div>
      <p class="field-label" style="margin-bottom:8px">Scan Mode</p>
      <div class="mode-row">
        <div class="mode-btn active" id="btn-checkin" onclick="setMode('checkin')">✓ Check In Mode</div>
        <div class="mode-btn"       id="btn-checkout" onclick="setMode('checkout')">→ Check Out Mode</div>
      </div>
    </div>

    <div>
      <p class="field-label" id="station-label">Entry Station</p>
      <select id="station-select" onchange="onStationChange()">
        <option value="">Loading stations…</option>
      </select>
    </div>

    <div id="scanning-section" class="section">
      <p class="scan-hint">Point the camera at a ticket QR code</p>
      <div id="reader"></div>
    </div>

    <div id="waiting-section" class="section active">
      <div class="notice">Select a station above before scanning.</div>
    </div>

    <div id="loading-section" class="section">
      <div class="spinner"></div>
      <p class="loading-text">Processing…</p>
    </div>

    <div id="result-section" class="section">
      <div class="status-icon" id="result-icon"></div>
      <p class="status-title" id="result-title"></p>
      <p class="status-detail" id="result-detail"></p>
    </div>
  </main>

  <script>
    // Dynamically uses the current server location (e.g., http://localhost:3000)
    let API_BASE = `${window.location.origin}/metro-tickets`;
    if (window.location.protocol === 'file:' || window.location.origin === 'null') {
      API_BASE = 'http://localhost:3000/metro-tickets';
    }
    let currentMode = 'checkin';
    let selectedStationId = null;
    let qrScanner = null;
    let autoResetTimer = null;

    // Helper to supply headers automatically if authentication is toggled back on
    function getHeaders() {
      const token = localStorage.getItem('token') || '';
      const headers = { 'Content-Type': 'application/json' };
      if (token) {
        headers['Authorization'] = `Bearer ${token}`;
      }
      return headers;
    }

    // ── Mode ──
    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-checkin').classList.toggle('active', mode === 'checkin');
      document.getElementById('btn-checkout').classList.toggle('active', mode === 'checkout');
      document.getElementById('station-label').textContent =
        mode === 'checkin' ? 'Entry Station' : 'Exit Station';
    }

    // ── Station Change Handler ──
    function onStationChange() {
      const val = document.getElementById('station-select').value;
      selectedStationId = val || null;

      if (selectedStationId) {
        startScannerIfNeeded();
      } else {
        stopScanner();
        showSection('waiting');
      }
    }

    async function loadStations() {
      const select = document.getElementById('station-select');
      try {
        // FIXED: Dropped the trailing slash to prevent Express routing mismatch
        const res = await fetch(`${API_BASE}/station`, {
          method: 'GET',
          headers: getHeaders()
        });
        const payload = await res.json();
        
        // Robust destructuring wrapper parsing array locations
        let stations = [];
        if (Array.isArray(payload)) stations = payload;
        else if (payload && Array.isArray(payload.data)) stations = payload.data;
        else if (payload && Array.isArray(payload.stations)) stations = payload.stations;

        if (stations.length === 0) throw new Error('Empty dataset payload');

        select.innerHTML = '<option value="">Select a station…</option>';
        stations.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s._id || s.id;
          opt.textContent = `${s.name} ${s.nameAr ? `(${s.nameAr})` : ''}`;
          select.appendChild(opt);
        });
      } catch (err) {
        console.warn("Backend dynamic fetch failed. Defaulting to local fallback values:", err);
        select.innerHTML = `
          <option value="">Select a station…</option>
          <option value="657c11f4b32d3a3411000001">Attaba (العتبة)</option>
          <option value="657c11f4b32d3a3411000002">Cairo University (جامعة القاهرة)</option>
          <option value="657c11f4b32d3a3411000003">Giza (الجيزة)</option>
        `;
      }
    }

    // ── Scanner Engine Loops ──
    function startScannerIfNeeded() {
      if (qrScanner) return; 
      showSection('scanning');
      qrScanner = new Html5Qrcode('reader');
      qrScanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 240, height: 240 } },
        onScanSuccess,
        () => {}
      ).catch(err => {
        document.querySelector('.scan-hint').textContent =
          'Camera access denied. Please verify system layer choices.';
        console.error('QR initialization failure:', err);
      });
    }

    function stopScanner() {
      if (!qrScanner) return;
      qrScanner.stop().catch(() => {});
      qrScanner = null;
    }

    async function onScanSuccess(decodedText) {
      const ticketId = decodedText.trim();
      stopScanner();
      showSection('loading');
      await doAction(ticketId);
    }

    // ── Post Processing Logic ──
    async function doAction(ticketId) {
      // Matches your parameterized ticket endpoint configurations precisely
      const endpoint = currentMode === 'checkin'
        ? `${API_BASE}/ticket/${ticketId}/checkin`
        : `${API_BASE}/ticket/${ticketId}/checkout`;

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify({ stationId: selectedStationId }),
        });
        const data = await res.json();

        const icon = document.getElementById('result-icon');
        const title = document.getElementById('result-title');
        const detail = document.getElementById('result-detail');

        if (res.ok) {
          icon.textContent = '✓';
          icon.className = 'status-icon success';
          title.textContent = currentMode === 'checkin' ? 'Checked In' : 'Checked Out';
          title.className = 'status-title success';
          detail.textContent = `Ticket …${ticketId.slice(-8)} verified successfully.`;
        } else {
          icon.textContent = '✕';
          icon.className = 'status-icon error';
          title.textContent = 'Action Declined';
          title.className = 'status-title error';
          detail.textContent = data.message || 'System validation conditions unmet.';
        }

        showSection('result');
      } catch (err) {
        console.error("Networking tracking dropped:", err);
        const icon = document.getElementById('result-icon');
        const title = document.getElementById('result-title');
        const detail = document.getElementById('result-detail');
        icon.textContent = '✕';
        icon.className = 'status-icon error';
        title.textContent = 'Network Error';
        title.className = 'status-title error';
        detail.textContent = 'Could not establish connection to ticketing node.';
        showSection('result');
      }

      clearTimeout(autoResetTimer);
      autoResetTimer = setTimeout(resetScanner, 2500);
    }

    function showSection(id) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(id + '-section').classList.add('active');
    }

    function resetScanner() {
      clearTimeout(autoResetTimer);
      if (selectedStationId) {
        startScannerIfNeeded();
      } else {
        showSection('waiting');
      }
    }

    // Run setup initialization
    loadStations();
  </script>
</body>
</html>

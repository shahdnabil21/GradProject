<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Metro Ticket Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(
    135deg,
    #020617 0%,
    #083344 50%,
    #022c22 100%
  );
  color: #f1f5f9;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;

  background: rgba(255,255,255,0.08);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.logo {
  width: 38px;
  height: 38px;

  background: rgba(255,255,255,0.12);

  border: 1px solid rgba(255,255,255,0.15);

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  flex-shrink: 0;
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  border-radius: 50%;
}

header h1 {
  font-size: 18px;
  font-weight: 700;
  color: white;
}

main {
  flex: 1;

  width: 100%;
  max-width: 520px;

  margin: 24px auto;

  padding: 28px;

  display: flex;
  flex-direction: column;
  gap: 18px;

  border-radius: 30px;

  background: rgba(255,255,255,0.08);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  border: 1px solid rgba(255,255,255,0.15);

  box-shadow: 0 25px 50px rgba(0,0,0,0.35);
}

/* Mode selector */

.mode-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.mode-btn {
  padding: 14px 12px;

  border-radius: 14px;

  background: rgba(255,255,255,0.08);

  border: 1px solid rgba(255,255,255,0.15);

  color: rgba(255,255,255,0.7);

  font-size: 14px;
  font-weight: 600;

  cursor: pointer;

  text-align: center;

  transition: all .25s ease;
}

.mode-btn.active {
  background: #0891b2;
  border-color: #0891b2;
  color: white;

  box-shadow: 0 10px 25px rgba(8,145,178,.35);
}

/* Labels */

.field-label {
  font-size: 13px;
  font-weight: 500;
  color: #cbd5e1;
  margin-bottom: 6px;
}

/* Select */

select {
  width: 100%;

  padding: 14px 40px 14px 16px;

  border-radius: 14px;

  border: 1px solid rgba(255,255,255,0.15);

  background: rgba(255,255,255,0.08);

  color: white;

  font-size: 15px;

  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;

  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23cbd5e1' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");

  background-repeat: no-repeat;
  background-position: right 12px center;
  background-size: 18px;

  cursor: pointer;

  transition: all .25s ease;
}

select:focus {
  outline: none;
  border-color: #22d3ee;
}

select option {
  background: #0f172a;
  color: white;
}

/* Sections */

.section {
  display: none;
  flex-direction: column;
  gap: 14px;
}

.section.active {
  display: flex;
}

/* Scanner */

.scan-hint {
  text-align: center;
  color: rgba(255,255,255,.7);
  font-size: 14px;
}

#reader {
  width: 100%;

  border-radius: 18px;

  overflow: hidden;

  background: rgba(255,255,255,0.08);

  border: 1px solid rgba(255,255,255,0.15);
}

#reader video {
  border-radius: 18px;
}

/* Loading */

#loading-section {
  align-items: center;
  padding: 48px 0;
  gap: 16px;
}

.spinner {
  width: 44px;
  height: 44px;

  border: 3px solid rgba(255,255,255,0.1);

  border-top-color: #22d3ee;

  border-radius: 50%;

  animation: spin .75s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.loading-text {
  color: rgba(255,255,255,.7);
  font-size: 14px;
}

/* Result */

#result-section {
  align-items: center;
  padding: 32px 0;
  gap: 18px;
  text-align: center;
}

.status-icon {
  width: 68px;
  height: 68px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 30px;
}

.status-icon.success {
  background: rgba(34,197,94,.15);
  border: 1px solid rgba(34,197,94,.3);
}

.status-icon.error {
  background: rgba(239,68,68,.15);
  border: 1px solid rgba(239,68,68,.3);
}

.status-title {
  font-size: 18px;
  font-weight: 700;
}

.status-title.success {
  color: #22d3ee;
}

.status-title.error {
  color: #fca5a5;
}

.status-detail {
  font-size: 14px;
  color: rgba(255,255,255,.7);
  max-width: 300px;
  line-height: 1.5;
}

/* Notice */

.notice {
  padding: 16px;

  border-radius: 18px;

  background: rgba(255,255,255,0.08);

  border: 1px solid rgba(255,255,255,0.08);

  color: rgba(255,255,255,.7);

  font-size: 13px;

  text-align: center;
}
</style>
</head>
<body>
  <header>
    <div class="logo">M</div>
    <h1>Metro Staff Scanner</h1>
  </header>

  <main>

    <!-- ── MODE + STATION (always visible) ── -->
    <div>
      <p class="field-label" style="margin-bottom:8px">Scan Mode</p>
      <div class="mode-row">
        <div class="mode-btn active" id="btn-checkin" onclick="setMode('checkin')">✓ Check In Mode</div>
        <div class="mode-btn"       id="btn-checkout" onclick="setMode('checkout')">→ Check Out Mode</div>
      </div>
    </div>

    <div>
      <p class="field-label" id="station-label">Entry Station</p>
      <select id="station-select" onchange="onStationChange()">
        <option value="">Loading stations…</option>
      </select>
    </div>

    <!-- ── SCANNING STATE ── -->
    <div id="scanning-section" class="section">
      <p class="scan-hint">Point the camera at a ticket QR code</p>
      <div id="reader"></div>
    </div>

    <!-- ── WAITING FOR STATION ── -->
    <div id="waiting-section" class="section active">
      <div class="notice">Select a station above before scanning.</div>
    </div>

    <!-- ── LOADING STATE ── -->
    <div id="loading-section" class="section">
      <div class="spinner"></div>
      <p class="loading-text">Processing…</p>
    </div>

    <!-- ── RESULT STATE ── -->
    <div id="result-section" class="section">
      <div class="status-icon" id="result-icon"></div>
      <p class="status-title" id="result-title"></p>
      <p class="status-detail" id="result-detail"></p>
    </div>

  </main>

  <script>
    const API_BASE = '/metro-tickets';
    let currentMode = 'checkin';
    let selectedStationId = null;
    let qrScanner = null;
    let autoResetTimer = null;

    // ── Mode ────────────────────────────────────────────────────────────────
    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-checkin').classList.toggle('active', mode === 'checkin');
      document.getElementById('btn-checkout').classList.toggle('active', mode === 'checkout');
      document.getElementById('station-label').textContent =
        mode === 'checkin' ? 'Entry Station' : 'Exit Station';
    }

    // ── Station ─────────────────────────────────────────────────────────────
    function onStationChange() {
      const val = document.getElementById('station-select').value;
      selectedStationId = val || null;

      if (selectedStationId) {
        startScannerIfNeeded();
      } else {
        stopScanner();
        showSection('waiting');
      }
    }

    async function loadStations() {
      const select = document.getElementById('station-select');
      try {
        const res  = await fetch(`${API_BASE}/station/`);
        const data = await res.json();
        const stations = data.data || [];

        if (stations.length === 0) throw new Error('Empty');

        select.innerHTML = '<option value="">Select a station…</option>';
        stations.forEach(s => {
          const opt = document.createElement('option');
          opt.value       = s._id;
          opt.textContent = `${s.name}  (${s.nameAr})`;
          select.appendChild(opt);
        });
      } catch {
        select.innerHTML = `
          <option value="">Select a station…</option>
          <option value="placeholder-attaba">Attaba</option>
          <option value="placeholder-cairo-uni">Cairo University</option>
          <option value="placeholder-giza">Giza</option>
        `;
      }
    }

    // ── Scanner ──────────────────────────────────────────────────────────────
    function startScannerIfNeeded() {
      if (qrScanner) return; // already running
      showSection('scanning');
      qrScanner = new Html5Qrcode('reader');
      qrScanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 240, height: 240 } },
        onScanSuccess,
        () => {}
      ).catch(err => {
        document.querySelector('.scan-hint').textContent =
          'Camera access denied. Please allow camera permission and refresh.';
        console.error('QR scanner error:', err);
      });
    }

    function stopScanner() {
      if (!qrScanner) return;
      qrScanner.stop().catch(() => {});
      qrScanner = null;
    }

    async function onScanSuccess(decodedText) {
      const ticketId = decodedText.trim();
      stopScanner();
      showSection('loading');
      await doAction(ticketId);
    }

    // ── Check In / Check Out ─────────────────────────────────────────────────
    async function doAction(ticketId) {
      const endpoint = currentMode === 'checkin'
        ? `${API_BASE}/ticket/${ticketId}/checkin`
        : `${API_BASE}/ticket/${ticketId}/checkout`;

      try {
        const res  = await fetch(endpoint, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ stationId: selectedStationId }),
        });
        const data = await res.json();

        const icon   = document.getElementById('result-icon');
        const title  = document.getElementById('result-title');
        const detail = document.getElementById('result-detail');

        if (res.ok) {
          icon.textContent  = '✓';
          icon.className    = 'status-icon success';
          title.textContent = currentMode === 'checkin' ? 'Checked In' : 'Checked Out';
          title.className   = 'status-title success';
          detail.textContent = `Ticket …${ticketId.slice(-8)} processed successfully.`;
        } else {
          icon.textContent  = '✕';
          icon.className    = 'status-icon error';
          title.textContent = 'Action Failed';
          title.className   = 'status-title error';
          detail.textContent = data.message || 'Something went wrong. Please try again.';
          if (data.stopsRequired && data.suggestedCategory) {
            detail.textContent +=
              ` Traveled ${data.stopsRequired} stops — suggested: ${data.suggestedCategory.name}.`;
          }
        }

        showSection('result');
      } catch {
        const icon   = document.getElementById('result-icon');
        const title  = document.getElementById('result-title');
        const detail = document.getElementById('result-detail');
        icon.textContent  = '✕';
        icon.className    = 'status-icon error';
        title.textContent = 'Network Error';
        title.className   = 'status-title error';
        detail.textContent = 'Could not reach the server. Check your connection.';
        showSection('result');
      }

      // Auto-reset after 2 seconds
      clearTimeout(autoResetTimer);
      autoResetTimer = setTimeout(resetScanner, 2000);
    }

    // ── Section helpers ──────────────────────────────────────────────────────
    function showSection(id) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.getElementById(id + '-section').classList.add('active');
    }

    // ── Reset ────────────────────────────────────────────────────────────────
    function resetScanner() {
      clearTimeout(autoResetTimer);
      if (selectedStationId) {
        startScannerIfNeeded();
      } else {
        showSection('waiting');
      }
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    loadStations();
  </script>
</body>
</html>
